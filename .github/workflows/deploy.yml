name: Deploy

# Publishes the P1 prototype: a static build, no relay needed yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # wrangler is a dev dependency rather than left to the action, which
      # installs its own copy on demand. In a pnpm workspace that install is
      # rejected: adding to the root needs an explicit flag the action does
      # not pass, so the deploy failed before it started.
      # Fails with a readable message rather than a wrangler stack trace when
      # the secrets are missing, which is easy to do: Actions secrets are
      # separate from Codespaces and Dependabot secrets in the same settings
      # page.
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::Add them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          # Copying from the dashboard easily picks up a trailing space or
          # newline, and wrangler then rejects the value with an error that
          # masks the real cause because the ID is redacted in the log.
          if printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qv '^[A-Za-z0-9_-]*$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID contains characters other than letters, digits, hyphens and underscores. It was probably copied with a space or newline. Re-add it with no surrounding whitespace."
            exit 1
          fi
          echo "Both deploy secrets are present and the account ID looks well formed."

          # Hand on whitespace-free copies, so a stray newline in a secret
          # cannot reach wrangler.
          {
            printf 'account_id=%s
' "$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          # Passed as env too: wrangler reads these directly, and relying on
          # the action's inputs alone left the token unset in the CLI.
          # The account ID comes from the check step, which strips any
          # whitespace: a value pasted with a trailing newline is rejected
          # outright and the log redacts it, hiding the cause.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.creds.outputs.account_id }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.creds.outputs.account_id }}
          wranglerVersion: "4.129.1"
          packageManager: pnpm
          command: pages deploy apps/web/dist --project-name=dance-game
