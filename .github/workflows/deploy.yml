name: Deploy

# Publishes the P1 prototype: a static build, no relay needed yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # wrangler is a dev dependency rather than left to the action, which
      # installs its own copy on demand. In a pnpm workspace that install is
      # rejected: adding to the root needs an explicit flag the action does
      # not pass, so the deploy failed before it started.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          packageManager: pnpm
          command: pages deploy apps/web/dist --project-name=dance-game
